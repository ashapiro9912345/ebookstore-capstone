# ============================================================
# E-Bookstore Application Configuration
# Do NOT add real credentials here.
# Set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables
# or override in application-local.properties (gitignored).
# ============================================================

spring.application.name=ebookstore

# --- DataSource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ebookstore}
spring.datasource.username=${DB_USERNAME:ebookstore}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Server ---
server.port=8080

# --- JWT ---
# Set JWT_SECRET to a Base64-encoded 256-bit (32-byte) secret in production.
# Default is provided only for local development convenience.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LW11c3QtYmUtY2hhbmdlZC1pbi1wcm9k}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Logging ---
logging.level.com.bookstore=DEBUG
logging.level.org.springframework.security=INFO
