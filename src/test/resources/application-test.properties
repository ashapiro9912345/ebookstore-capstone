# ============================================================
# Test profile — integration tests run against a REAL, LOCAL
# PostgreSQL database (ebookstore_test), never H2.
#
# This keeps persistence/integration behaviour validated against
# the same database engine the application uses in Phase 5.
#
# The credentials below are LOCAL-TEST-ONLY values for an
# isolated throwaway database. They are not production secrets.
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/ebookstore_test
spring.datasource.username=ebookstore_test
spring.datasource.password=test_local_only
spring.datasource.driver-class-name=org.postgresql.Driver

# Validate entity mappings against the schema created from schema.sql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Deterministic JWT secret for tests (Base64 of a 32-byte local-only key)
app.jwt.secret=dGVzdC1vbmx5LXNlY3JldC0zMi1ieXRlcy1sb25nLWFhYWE=
app.jwt.expiration-ms=86400000

logging.level.com.bookstore=WARN
logging.level.org.springframework.security=WARN
